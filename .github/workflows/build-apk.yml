name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (licenses accepted automatically)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (compileSdk 35 / build-tools 35.0.0)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore google-services.json from secret (optional override)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | base64 -d >/dev/null 2>&1; then
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            fi
            echo "google-services.json restored"
          else
            test -f android/app/google-services.json && echo "Using committed google-services.json"
          fi

      - name: Decode release keystore (if configured)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            echo "BUILD_VARIANT=Release" >> "$GITHUB_ENV"
            echo "release keystore restored"
          else
            echo "BUILD_VARIANT=Debug" >> "$GITHUB_ENV"
            echo "No release keystore secret — building debug APK"
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor assets into the native project
        run: npx cap sync android

      - name: Assemble APK
        run: cd android && chmod +x gradlew && ./gradlew "assemble$BUILD_VARIANT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: mobile-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
